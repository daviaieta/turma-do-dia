<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Os personagens da Turma do Dia</title>
<link rel="stylesheet" href="../../Sources/Turma/Resources/web/card.css">
<style>
  body{background:#F7F3EA;color:#2B2420;padding:28px 20px 40px;overflow:auto}
  main{max-width:960px;margin:0 auto}
  h1{font-size:26px;margin:0 0 4px}
  p.lead{margin:0 0 22px;color:#7A6F66}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
  @media (max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}
  .c{background:#FFFDF8;border:1px solid #E7DFD0;border-radius:18px;padding:12px;text-align:center}
  .st{background:#F4EEE2;border-radius:12px;height:150px;display:flex;align-items:center;justify-content:center}
  .st svg{height:132px;width:auto;overflow:visible;filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff)}
  .c b{display:block;margin-top:8px;font-size:17px}
  .c span{display:block;font-size:12.5px;color:#7A6F66;line-height:1.3}
</style>
</head>
<body>
<main>
  <h1>Os personagens</h1>
  <p class="lead">Dez desenhos originais, um por lembrete. Cada um é um SVG gerado por código (<code>characters.js</code>).</p>
  <div class="grid" id="g"></div>
</main>
<script src="../../Sources/Turma/Resources/web/characters.js"></script>
<script>
const LIST = [
  ['sol','Sol','Acordar'],['mochila','Mochila','Sair de casa'],['gota','Gota','Água'],['prato','Prato','Comer'],
  ['prompt','Prompt','Código'],['gi','Gi','Jiu-jitsu'],['peso','Peso','Academia'],['lua','Lua','Óculos da noite'],
  ['claquete','Claquete','Conteúdo'],['travesseiro','Travesseiro','Dormir']
];
document.getElementById('g').innerHTML = LIST.map(([id,n,s]) =>
  `<div class="c"><div class="st">${Characters.svg(id,'smile')}</div><b>${n}</b><span>${s}</span></div>`).join('');
</script>
</body>
</html>
